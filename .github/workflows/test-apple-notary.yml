name: Test Apple Notary API

on:
  workflow_dispatch:

jobs:
  test-notary-auth:
    runs-on: macos-15
    env:
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Setup key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 -d > "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          ls -la "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "Key file created. First 100 chars:"
          head -c 100 "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo ""

      - name: Test notarytool auth
        run: |
          echo "=== Testing notarytool with key ==="
          xcrun notarytool history \
            --key "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            2>&1
          echo "=== Exit code: $? ==="

      - name: Test notarytool submit (dry run)
        run: |
          echo "=== Creating dummy app for notarization test ==="
          mkdir -p /tmp/test.app/Contents/MacOS
          echo '#!/bin/bash' > /tmp/test.app/Contents/MacOS/test
          chmod +x /tmp/test.app/Contents/MacOS/test
          echo '<?xml version="1.0"?><plist version="1.0"><dict><key>CFBundleExecutable</key><string>test</string></dict></plist>' > /tmp/test.app/Contents/Info.plist
          echo "=== Attempting notarytool submit ==="
          xcrun notarytool submit /tmp/test.app \
            --key "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            2>&1 || true
